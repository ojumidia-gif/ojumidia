name: oju-qa

services:
  db:
    image: mysql:8.4
    container_name: oju-qa-mysql
    environment:
      MYSQL_DATABASE: oju_midia_qa
      MYSQL_USER: oju_qa
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?defina MYSQL_PASSWORD em .env.qa}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?defina MYSQL_ROOT_PASSWORD em .env.qa}
    ports:
      - "3307:3306"
    volumes:
      - oju_qa_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "--password=$${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 25s

volumes:
  oju_qa_mysql_data:
