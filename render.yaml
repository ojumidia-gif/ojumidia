services:
  - type: web
    runtime: node
    name: oju-midia
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm build
    preDeployCommand: pnpm db:migrate
    startCommand: pnpm start
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_OAUTH_REDIRECT_URI
        sync: false
      - key: GOOGLE_SUPER_ADMIN_EMAILS
        sync: false
      - key: GOOGLE_SUPER_ADMIN_SUBS
        sync: false
      - key: EDITORIAL_TRASH_CRON_SECRET
        sync: false
