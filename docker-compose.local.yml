services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-oju_midia}
      MYSQL_USER: ${MYSQL_USER:-oju_local}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?defina MYSQL_PASSWORD no arquivo .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?defina MYSQL_ROOT_PASSWORD no arquivo .env}
    ports:
      - "3306:3306"
    volumes:
      - oju_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "--password=$${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 12

  app:
    build:
      context: .
      dockerfile: docker/Dockerfile.local
    env_file:
      - .env
    environment:
      DATABASE_URL: mysql://${MYSQL_USER:-oju_local}:${MYSQL_PASSWORD}@db:3306/${MYSQL_DATABASE:-oju_midia}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${PORT:-3000}:3000"
    volumes:
      - ./:/app
      - oju_node_modules:/app/node_modules
    command: corepack pnpm dev

volumes:
  oju_mysql_data:
  oju_node_modules:
